name: Build Macro Studio MAX 2.4.0

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout editable source
        uses: actions/checkout@v4

      - name: Java 25 for Fabric Loom
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Check current version and remove legacy archives
        run: |
          set -euo pipefail
          test -f src/main/java/com/macrostudio/Digger.java
          test -f src/main/java/com/macrostudio/MacroStudioScreen.java
          grep -q '^mod_version=2.4.0$' gradle.properties
          test ! -f project.zip
          test ! -f MacroStudio-GitHub-Ready.zip
          echo "Compiling source version 2.4.0"

      - name: Build JAR
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Verify mod version and classes
        shell: bash
        run: |
          set -euo pipefail
          JAR=build/libs/macro-studio-2.4.0.jar
          test -f "$JAR"
          unzip -p "$JAR" fabric.mod.json | grep -q '"version": "2.4.0"'
          unzip -Z -1 "$JAR" | grep -q 'com/macrostudio/Digger.class'
          unzip -Z -1 "$JAR" | grep -q 'com/macrostudio/MacroStudioScreen.class'
          unzip -Z -1 "$JAR" | grep -q 'com/macrostudio/SmartPath.class'
          unzip -Z -1 "$JAR" | grep -q 'com/macrostudio/SelectionVisualizer.class'
          unzip -Z -1 "$JAR" | grep -q 'com/macrostudio/ResourceCatalog.class'
          unzip -Z -1 "$JAR" | grep -q 'com/macrostudio/DrillAssist.class'
          unzip -Z -1 "$JAR" | grep -q 'assets/macrostudio/icon.png'
          unzip -p "$JAR" fabric.mod.json | grep -q '"icon": "assets/macrostudio/icon.png"'
          sha256sum "$JAR"

      - name: Upload single current JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MacroStudio-MAX-2.4.0
          path: build/libs/macro-studio-2.4.0.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload error log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MacroStudio-build-errors
          path: build.log
          if-no-files-found: ignore
