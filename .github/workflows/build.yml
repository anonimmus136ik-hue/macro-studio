name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Unpack project
        run: unzip -q project.zip -d work
      - name: Build
        working-directory: work
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon 2>&1 | tee ../build.log
      - name: Show errors
        if: failure()
        run: |
          echo '### Ошибки компиляции' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "error:" -A2 build.log | head -80 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: macro-studio
          path: |
            work/build/libs/*.jar
            !work/build/libs/*-sources.jar
