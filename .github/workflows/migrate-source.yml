name: One-time Macro Studio source migration
on:
  push:
    branches:
      - upgrade/macro-studio-max-2-2
    paths:
      - .github/workflows/migrate-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.ref == 'refs/heads/upgrade/macro-studio-max-2-2'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Migrate sources and remove legacy versions
        shell: bash
        run: |
          set -euo pipefail
          test -f project.zip
          unzip -tq project.zip
          mkdir -p "$RUNNER_TEMP/macro-current"
          unzip -q project.zip -d "$RUNNER_TEMP/macro-current"
          test -f "$RUNNER_TEMP/macro-current/src/main/java/com/macrostudio/MacroStudioScreen.java"
          test -f "$RUNNER_TEMP/macro-current/gradle/wrapper/gradle-wrapper.jar"
          cp -a "$RUNNER_TEMP/macro-current/." .
          python3 - <<'PY'
          from pathlib import Path
          
          def replace(path, old, new):
              p = Path(path)
              s = p.read_text(encoding="utf-8")
              if old not in s:
                  raise RuntimeError("Missing expected code: " + str(path) + " " + repr(old))
              p.write_text(s.replace(old, new), encoding="utf-8")
          
          base = Path("src/main/java/com/macrostudio")
          replace("gradle.properties", "mod_version=2.1.0", "mod_version=2.2.0")
          replace("src/main/resources/fabric.mod.json", '"name": "Macro Studio MAX"', '"name": "Macro Studio MAX 2.2"')
          screen = base / "MacroStudioScreen.java"
          replace(screen, 'super(Component.literal("Macro Studio MAX"));', 'super(Component.literal("Macro Studio MAX 2.2.0"));')
          replace(screen, 'line(g, "v2.1",', 'line(g, "v2.2.0",')
          replace(screen, 'line(g, "MAX  /  1.21.11",', 'line(g, "MAX 2.2  /  1.21.11",')
          replace(screen, 'Digger.setLookedPoint(mc, 1)', 'Digger.setSavedLookedPoint(1, lookedPos)')
          replace(screen, 'Digger.setLookedPoint(mc, 2)', 'Digger.setSavedLookedPoint(2, lookedPos)')
          digger = base / "Digger.java"
          anchor = '    public static void setPoint(Minecraft mc, int which) {'
          addition = '''    /** Uses the exact block under the crosshair when the GUI was opened. */
              public static void setSavedLookedPoint(int which, int[] snapshot) {
                  if (snapshot == null || snapshot.length < 3) {
                      Recorder.msg("Наведи прицел на блок перед открытием меню");
                      return;
                  }
                  setCoords(which, new BlockPos(snapshot[0], snapshot[1], snapshot[2]));
              }
          
          '''
          replace(digger, anchor, addition + anchor)
          mod = base / "MacroStudioMod.java"
          replace(mod, 'private static Set<Integer> prevDown = new HashSet<>();',
                       'private static Set<Integer> prevDown = new HashSet<>();\n\tprivate static boolean worldAnnounced = false;')
          replace(mod, 'private static void tick(Minecraft mc) {\n',
          '''private static void tick(Minecraft mc) {
                  if (mc.player == null) {
                      worldAnnounced = false;
                  } else if (!worldAnnounced) {
                      worldAnnounced = true;
                      Recorder.msg("Macro Studio MAX 2.2.0 загружен — Right Ctrl открывает меню");
                  }
          ''')
          print("Updated GUI version, saved-look selection and world-load confirmation")
          PY
          cat > README.md <<'README'
          # Macro Studio MAX 2.2.0
          
          Client-side Fabric mod for Minecraft Java 1.21.11. This repo contains ONE current version as editable source. Old uploaded ZIP versions are removed from main.
          
          ## Install the real mod
          
          1. Open GitHub Actions in this repository.
          2. Open latest successful "Build Macro Studio MAX 2.2.0" on main.
          3. Download the "MacroStudio-MAX-2.2.0" artifact ZIP and extract it.
          4. Place ONLY macro-studio-2.2.0.jar into the active Minecraft instance's mods folder. Remove all previous macro-studio JARs from that same instance.
          5. Enter a world. The message "Macro Studio MAX 2.2.0 загружен" confirms the new version has loaded.
          
          Open the GUI with Right Ctrl. On MINING use POS1 LOOK / FEET, POS2 LOOK / FEET, then START, PAUSE / RESUME and STOP. LOOK uses the block captured when opening the menu.
          
          ## Build
          
          Fabric Loom needs Java 25 to run Gradle. Compiled bytecode targets Java 21. Build using gradlew.bat build (Windows) or ./gradlew build (Linux).
          
          ## Implemented
          
          Mining Studio with smooth camera turning, real reach/aim checks, selection, progress, pause; Recorder/Replayer, AutoTool, AutoRefill, AutoEat, AutoDeposit, Shulker Preview, HUD, keybinds and visual/performance settings.
          
          Not implemented: AutoFish, AutoFarm, AutoBuild, A* pathfinding and 3D in-world selection.
          
          A successful CI build confirms compilation, not successful use in Minecraft. Historical Git commits and old Actions logs remain accessible.
          README
          rm -f -- project.zip MacroStudio-GitHub-Ready.zip README_MAX_RU.md
          rm -f -- overrides/apply-mining.py
          rmdir overrides 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Upgrade to Macro Studio MAX 2.2.0 editable source and remove old ZIP versions'
          git push origin HEAD:upgrade/macro-studio-max-2-2
