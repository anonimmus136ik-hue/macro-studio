name: Macro Studio package validation

on:
  push:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract development package
        run: |
          set -euo pipefail
          unzip -q 'Macro-Studio-GitHub-1.21.11.zip' -d work
          test -f work/macro-studio-1.0.0.jar
          test -f work/scripts/verify-core.sh

      - name: Test standalone Java core
        run: bash work/scripts/verify-core.sh

      - name: Verify existing mod JAR
        run: jar tf work/macro-studio-1.0.0.jar > /dev/null

      - name: Upload original JAR (not a new mod build)
        uses: actions/upload-artifact@v4
        with:
          name: macro-studio-original-jar
          path: work/macro-studio-1.0.0.jar
          if-no-files-found: error
